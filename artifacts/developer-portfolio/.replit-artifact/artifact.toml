kind = "web"
previewPath = "/"
title = "Developer Portfolio"
description = "A polished, responsive personal portfolio for a fresher Computer Science Engineer, designed to help recruiters quickly understand their skills, projects, education, and readiness for an entry-level software engineering role."
version = "1.0.0"
id = "artifacts/developer-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19815

[services.development]
run = "pnpm --filter @workspace/developer-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/developer-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/developer-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19815"
BASE_PATH = "/"
